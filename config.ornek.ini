# CNC Log System - ayar dosyasi
#
# KULLANIM: Bu dosyayi "config.ini" adiyla kopyalayin ve duzenleyin.
#     cp config.ornek.ini config.ini
#
# Bu dosya olmadan da program calisir; asagidaki degerler varsayilandir.
# Bozuk bir deger yazilirsa program durmaz, o ayar varsayilana doner.
# Satir basina # koyarak aciklama yazabilirsiniz.


[genel]
# Tezgahi ayirt eden kisa kimlik. Ileride birden fazla tezgah izlenirse
# kayitlar bununla ayrilir.
makine_id = TEZGAH-01

# Arayuzde ve raporlarda gorunen ad.
makine_adi = Heidenhain TNC 640

# Verilerin yazilacagi klasor. Goreli yazilirsa program klasorune gore
# hesaplanir. Icinde cnclog.db ve loglar/ klasoru olusur.
veri_dizini = veri


[toplama]
# Tezgahtan kac saniyede bir olcum alinacak.
# Daha kucuk deger = daha hassas ama daha buyuk veritabani.
ornekleme_araligi_sn = 2.0

# Bir duruş, kayda gecmeden once en az kac saniye surmeli.
# Amac: takim degisimi gibi cok kisa duraklamalarin logu sismesini onlemek.
#
#   10  -> 10 saniyeden kisa duraklamalar OLAY olarak yazilmaz
#          (yine de olcum kaydinda gorunur, veri kaybolmaz)
#    0  -> esik yok, her duraklama aninda kaydedilir
#
# Parca degisimi genelde 30 saniyeden uzun surdugu icin 10 ile de yakalanir.
durus_esigi_sn = 10

# Metin loguna kac saniyede bir rutin durum satiri yazilacak.
# Durum degisimleri bu ayardan bagimsiz olarak her zaman yazilir.
log_araligi_sn = 30

# Bu degerin uzerindeki ilerleme "hizli hareket (G0)" sayilir.
# Sadece tezgah G0 bilgisini dogrudan vermiyorsa kullanilir.
hizli_ilerleme_esigi = 5000

# Ayrintili olcum kayitlari kac gun saklanacak.
# Olaylar (durus, alarm, program) HICBIR ZAMAN silinmez, sadece olcumler.
# 0 yazilirsa hicbir sey silinmez (veritabani buyur).
saklama_gun = 90


[surucu]
# Hangi surucu kullanilacak:
#
#   auto              VARSAYILAN. Tezgahi kendi bulur:
#                       1) asagidaki tnc_ip (yazilmissa)
#                       2) bu bilgisayarin kendisi (127.0.0.1)
#                       3) ayni agdaki diger adresler
#                     Bulamazsa "BAGLANTI YOK" olarak kaydeder ve aramaya
#                     devam eder. ASLA sahte veri uretmez.
#   heidenhain_lsv2   Adresi elle vermek isterseniz. tnc_ip zorunlu.
#   heidenhain_opcua  OPC UA NC Server (Opsiyon 56). Gercek F/S okur.
#                     'asyncua' paketi ayrica kurulmalidir.
#   simulator         Sahte tezgah. SADECE deneme icin, gercek kayitta
#                     kullanmayin.
tip = auto

# Tezgahin ag adresi. Bos birakilirsa otomatik aranir.
# Adresi biliyorsaniz yazin: her aramada ilk sirada denenir, arama hizlanir.
#   Ornek:  tnc_ip = 192.168.1.50
tnc_ip =

# LSV2 portu. Heidenhain kontrollerde standart deger 19000'dir.
tnc_port = 19000

# Cevap beklenirken kac saniye sonra vazgecilecek.
zaman_asimi_sn = 5.0

# Bilinen adreslerde bulunamazsa yerel ag taransin mi? (evet / hayir)
# Tarama sadece TCP baglanti denemesidir, hicbir veri gonderilmez.
# 253 adres yaklasik 2-3 saniyede taranir.
otomatik_arama = evet


[opcua]
# SADECE tip = heidenhain_opcua ise kullanilir.
#
# Node kimlikleri her tezgahta ve her makine ureticisinde farklidir,
# bu yuzden buraya elle yazilir. Tezgahtaki degiskenleri listelemek icin:
#
#     ./baslat.sh --surucu heidenhain_opcua --test-baglanti
#
# Cikan listeden ilgili node kimliklerini asagiya yapistirin.

# Bos birakilirsa  opc.tcp://<tnc_ip>:4840  kullanilir.
adres =

# Sunucu kullanici dogrulamasi istiyorsa doldurun.
kullanici =
sifre =

# Guvenlik ayari, ornek:
#   Basic256Sha256,SignAndEncrypt,sertifika.der,anahtar.pem
guvenlik =

# Okunacak node kimlikleri (bos birakilanlar okunmaz).
node_program_durumu =
node_calisma_modu =
node_feed =
node_spindle =
node_program_adi =
node_takim =


[web]
# Arayuzun dinleyecegi adres.
#   127.0.0.1  -> sadece bu bilgisayardan erisilir (GUVENLI, varsayilan)
#   0.0.0.0    -> agdaki herkes erisebilir
#
# DIKKAT: 0.0.0.0 yaparsaniz atolyedeki herkes verileri gorebilir.
# Sifre korumasi YOKTUR. Sadece guvendiginiz bir agda kullanin.
bind = 127.0.0.1

# Arayuz portu. Baska bir program bu portu kullaniyorsa degistirin.
port = 8760

# Program acilinca tarayici otomatik acilsin mi? (evet / hayir)
# Servis olarak arka planda calistiriyorsaniz "hayir" yapin.
tarayici_ac = evet


[vardiya]
# Vardiya baslangic saatleri, virgulle ayrilmis.
# Raporda gun bu araliklara bolunerek gosterilir.
# Ornek tek vardiya icin:  baslangiclar = 08:00
baslangiclar = 08:00, 16:00, 00:00
